[project]
name = "20260322-langgraph-tasklist-manager"
version = "0.1.0"
description = "Task management agent using LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langgraph-cli[inmem]>=0.1.12",
    "langchain-google-genai>=1.0.0",
    "langchain-core>=0.2.0",
    "pymongo[srv]>=4.10.0",
    "python-dotenv>=1.0.1",
    "google-cloud-firestore>=2.19.0",
    "langgraph-checkpoint-firestore>=0.1.7",
    "pydantic>=2.7.0",
    "pandas>=2.2.0",
    "click>=8.3.2",
    "langchain-community>=0.4.1",
    "langchain-text-splitters>=1.1.1",
    "bs4>=0.0.2",
    "tiktoken>=0.12.0",
    "fastembed>=0.8.0",
    "google-cloud-bigquery>=3.41.0",
]

[tool.black]

# isort -> black
# https://black.readthedocs.io/en/stable/guides/using_black_with_other_tools.html
[tool.isort]
profile = "black"

[dependency-groups]
dev = [
    "langsmith>=0.7.25",
]
